spring.application.name=autoscript

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Change these to match your local Postgres install.
# Default Postgres port is 5432; create a database called "autoscript" first:
#   CREATE DATABASE autoscript;
spring.datasource.url=jdbc:postgresql://localhost:5432/autoscript
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → create/alter tables automatically (good for dev)
# validate → only check schema (use for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── CORS (allow React dev server) ────────────────────────────────────────────
# Handled in WebConfig.java — no extra property needed

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
