spring.application.name=autoscript

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Change these to match your local Postgres install.
# Default Postgres port is 5432; create a database called "autoscript" first:
#   CREATE DATABASE autoscript;
spring.datasource.url=jdbc:postgresql://localhost:5432/autoscript
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → create/alter tables automatically (good for dev)
# validate → only check schema (use for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── AI script-reviewer (via OpenRouter, OpenAI-compatible) ───────────────────
# The AI beans only load when autoscript.ai.enabled=true, so the core app boots
# without a key. OpenRouter is OpenAI-compatible, so Spring AI's OpenAI client
# works by only changing the base URL + model. To enable:
#   AUTOSCRIPT_AI_ENABLED=true  and  LLM_API_KEY=<your OpenRouter key>
autoscript.ai.enabled=${AUTOSCRIPT_AI_ENABLED:false}

# Base URL: OpenRouter's OpenAI-compatible endpoint (override with LLM_BASE_URL).
spring.ai.openai.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
# Spring AI defaults to appending "/v1/chat/completions". The base URL above
# already ends in /v1, so use the bare path to avoid ".../v1/v1/chat/completions".
spring.ai.openai.chat.completions-path=/chat/completions
# API key: prefer LLM_API_KEY (spec name); fall back to OPENAI_API_KEY.
spring.ai.openai.api-key=${LLM_API_KEY:${OPENAI_API_KEY:not-set}}

# Chat + vision models. Gemini 2.5 Flash handles both text and image parts.
spring.ai.openai.chat.options.model=${LLM_MODEL:google/gemini-2.5-flash}
# Low temperature for deterministic, factual extraction (spec: 0.1).
spring.ai.openai.chat.options.temperature=0.1
# Cap the response size. Without this OpenRouter reserves the model maximum
# (65,535 tokens) and rejects the call with 402 on keys with a credit limit.
spring.ai.openai.chat.options.max-tokens=${LLM_MAX_TOKENS:4000}

# OpenRouter attribution headers (optional but recommended by OpenRouter).
spring.ai.openai.chat.options.http-headers.HTTP-Referer=${LLM_REFERER:http://localhost:8080}
spring.ai.openai.chat.options.http-headers.X-Title=AutoScript

# ── File upload limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
autoscript.extraction.prompt=0

# ── CORS (allow React dev server) ────────────────────────────────────────────
# Handled in WebConfig.java — no extra property needed

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
