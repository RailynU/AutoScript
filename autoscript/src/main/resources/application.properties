spring.application.name=autoscript

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Change these to match your local Postgres install.
# Default Postgres port is 5432; create a database called "autoscript" first:
#   CREATE DATABASE autoscript;
spring.datasource.url=jdbc:postgresql://localhost:5432/autoscript
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → create/alter tables automatically (good for dev)
# validate → only check schema (use for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Spring AI (script-reviewer feature) ──────────────────────────────────────
# The AI script-reviewer beans only load when autoscript.ai.enabled=true.
# Leave it false so the core app boots without an OpenAI key. To use the
# prescription-image extraction feature, set:
#   autoscript.ai.enabled=true  and  OPENAI_API_KEY=<your key>
autoscript.ai.enabled=${AUTOSCRIPT_AI_ENABLED:false}
# Which extractor backs Autofill when AI is enabled: openai (real vision model,
# needs OPENAI_API_KEY) or stub (deterministic offline sample data, no key).
autoscript.ai.mode=${AUTOSCRIPT_AI_MODE:openai}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.0

# ── File upload limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
autoscript.extraction.prompt=0

# ── CORS (allow React dev server) ────────────────────────────────────────────
# Handled in WebConfig.java — no extra property needed

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
