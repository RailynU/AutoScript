spring.application.name=autoscript

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Change these to match your local Postgres install.
# Default Postgres port is 5432; create a database called "autoscript" first:
#   CREATE DATABASE autoscript;
spring.datasource.url=jdbc:postgresql://localhost:5432/autoscript
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → create/alter tables automatically (good for dev)
# validate → only check schema (use for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Spring AI (script-reviewer feature) ──────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.0

# ── File upload limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
autoscript.extraction.prompt=0

# ── CORS (allow React dev server) ────────────────────────────────────────────
# Handled in WebConfig.java — no extra property needed

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
